name: Build and Deploy to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write  # Required to push to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Site and Zip
        run: |
          mkdir -p _site
          
          # 1. Process userscripts and add @updateURL
          echo "🔧 Processing userscripts and adding @updateURL..."
          shopt -s nullglob
          for script in *.user.js; do
            if [ -f "$script" ]; then
              echo "Processing $script..."
              # Add @updateURL after the first ==UserScript== line
              # The update URL points to the GitHub Pages location
              awk -v url="https://browser-userscripts.spacebarlabs.com/$script" '
                /^\/\/ ==UserScript==/ {
                  print $0
                  print "// @updateURL       " url
                  next
                }
                { print }
              ' "$script" > "_site/$script"
            fi
          done
          
          # 2. Create the Zip Archive of all processed scripts
          # We use || true to prevent failure if no scripts exist yet
          echo "📦 Zipping scripts..."
          cd _site
          zip -r all-scripts.zip *.user.js 2>/dev/null || echo "No .user.js files found to zip yet."
          cd ..
          
          # 3. Start the HTML file
          cat <<HTML > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Spacebar Labs Userscripts</title>
            <style>
              body { font-family: -apple-system, system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
              h1 { border-bottom: 2px solid #eee; padding-bottom: 0.5rem; }
              .script-card { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; background: #fafafa; }
              .script-card:hover { border-color: #bbb; }
              .btn { display: inline-block; background: #2da44e; color: white; padding: 0.5rem 1rem; text-decoration: none; border-radius: 6px; font-weight: bold; }
              .btn:hover { background: #2c974b; }
              .meta { font-size: 0.9em; color: #666; margin-top: 0.5rem; }
              .download-all { display: block; background: #eee; text-align: center; padding: 1rem; border-radius: 8px; margin-bottom: 2rem; color: #333; text-decoration: none; font-weight: bold; border: 1px solid #ddd; }
              .download-all:hover { background: #e3e3e3; }
            </style>
          </head>
          <body>
            <h1>Browser Userscripts</h1>
            <a href="all-scripts.zip" class="download-all">⬇️ Download All Scripts (.zip)</a>
            <div id="script-list">
          HTML

          # 4. Loop through processed scripts in _site and append to HTML
          shopt -s nullglob
          for script in _site/*.user.js; do
            script_basename=$(basename "$script")
            NAME=$(grep -m 1 "@name " "$script" | sed 's/.*@name\s*//')
            DESC=$(grep -m 1 "@description " "$script" | sed 's/.*@description\s*//')
            if [ -z "$NAME" ]; then NAME="$script_basename"; fi
            
            echo "Generating HTML for: $NAME"
            
            cat <<BLOCK >> _site/index.html
            <div class="script-card">
              <h3>$NAME</h3>
              <p>$DESC</p>
              <div class="meta">Filename: $script_basename</div>
              <br>
              <a href="$script_basename" class="btn">Install Script</a>
            </div>
          BLOCK
          done

          # 5. Close HTML
          cat <<HTML >> _site/index.html
            </div>
            <p style="margin-top: 3rem; color: #999; font-size: 0.8rem;">Generated automatically by GitHub Actions.</p>
          </body>
          </html>
          HTML
          
          # 6. Handle Custom Domain (CNAME)
          # Since you have a custom domain configured in your screenshot, we must preserve it.
          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
          elif [ -n "${{ vars.CNAME_DOMAIN }}" ]; then 
            # Optional: if you set a repository variable CNAME_DOMAIN
            echo "${{ vars.CNAME_DOMAIN }}" > _site/CNAME
          fi

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages 
          folder: _site
